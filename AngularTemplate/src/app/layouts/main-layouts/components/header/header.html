<header class=" a container-fluid p-0">
    <div class="d-flex flex-row justify-content-between container-fluid mb-3"> <!--primera fila-->
        <div class="d-flex flex-row gap-3">

            <div class="d-flex flex-row gap-1">
                <img src="/images/logo.png" alt="" class="img-fluid">
            </div>

        </div>

        <div class="barra-g d-flex flex-row justify-content-between align-items-center pt-3 ps-3 text-secondary ">

            <div class="  d-flex flex-row gap-4">

                <div class="letras d-flex flex-row gap-1 ">
                    <button class="letras btn"routerLink="/">Home</button>

                </div>

                <div class=" letras d-flex flex-row gap-1">
                    <button  class=" letras btn"routerLink="/carrito">Shop</button>

                </div>

                <div class="letras d-flex flex-row gap-1 ">
                    <button  class="letras btn "routerLink="/productos">Product</button>


                </div>



                <div class="letras d-flex flex-row gap-1 c-naranja">
                    <button class="letras btn  "routerLink="/sobreNosotros">About Us</button>

                </div>

            </div>

        </div>

        <div class=" iconos-compra d-flex flex-row gap-3 text-secondary mt-5 align-items-center">

            @if (userName) {
                <div class="d-flex flex-row gap-2 align-items-center">
                    <span class="fw-bold text-dark">Hola, {{ userName }}</span>
                    <button class="btn btn-outline-danger btn-sm" (click)="logout()">Cerrar sesión</button>
                </div>
            } @else {
                <div class="d-flex flex-row gap-1">
                    <button class="btn mi"> <i class=" iconos-compra bi bi-person-fill"routerLink="/login"></i></button>
                </div>
            }

            <div class="d-flex flex-row gap-1">
                <button class="btn mi "> <i class=" iconos-compra bi bi-cart"routerLink="/carrito"></i></button>
            </div>


        </div>
    </div>

</header>
