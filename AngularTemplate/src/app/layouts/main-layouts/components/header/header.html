<header class="a container-fluid p-0">
    <div class="d-flex flex-row justify-content-between container-fluid mb-3">

        <!-- LOGO -->
        <div class="d-flex flex-row gap-3">
            <div class="d-flex flex-row gap-1">
                <img src="/images/logo.png" alt="Logo" class="img-fluid logo-header">
            </div>
        </div>

        <!-- MENÚ PRINCIPAL -->
        <div class="barra-g d-flex flex-row justify-content-between align-items-center pt-3 ps-3 text-secondary menu-principal">
            <div class="d-flex flex-row gap-4">
                <div class="letras d-flex flex-row gap-1">
                    <button class="letras btn" routerLink="/">Home</button>
                </div>

                <div class="letras d-flex flex-row gap-1">
                    <button class="letras btn" routerLink="/carrito">Shop</button>
                </div>

                <div class="letras d-flex flex-row gap-1">
                    <button class="letras btn" routerLink="/productos">Product</button>
                </div>

                <div class="letras d-flex flex-row gap-1 c-naranja">
                    <button class="letras btn" routerLink="/sobreNosotros">About Us</button>
                </div>
            </div>
        </div>

        <!-- ICONOS Y USUARIO -->
        <div class="iconos-compra d-flex flex-row gap-3 text-secondary mt-5 align-items-center iconos-header">

            @if (isLoggedIn) {
                <div class="d-flex flex-row gap-2 align-items-center usuario-log">
                    <span class="fw-bold text-dark">Hola, {{ userName }}</span>

                    <button class="btn btn-light btn-sm" routerLink="/mis-pedidos">
                        Mis pedidos
                    </button>

                    <button class="btn btn-outline-danger btn-sm" (click)="logout()">
                        Cerrar sesión
                    </button>
                </div>
            }

            @else {
                <div class="d-flex flex-row gap-1">
                    <button class="btn mi">
                        <i class="iconos-compra bi bi-person-fill" routerLink="/login"></i>
                    </button>
                </div>
            }

            <div class="d-flex flex-row gap-1">
                <button class="btn mi">
                    <i class="iconos-compra bi bi-cart" routerLink="/carrito"></i>
                </button>
            </div>
        </div>
    </div>
</header>
