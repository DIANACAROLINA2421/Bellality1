<section class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <h3 class="mb-4 fw-bold">Pasarela Pago <i class="bi bi-credit-card"></i></h3>


            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Pago </h5>

                    <form>
                        <div class="mb-3">
                            <label class="form-label">Nombre Titular </label>
                            <input type="text" class="form-control" placeholder="Nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Numero Cuenta </label>
                            <input type="text" class="form-control"  placeholder="0000 0000 0000" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha Expediccion </label>
                            <input type="date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">CVC </label>
                            <input type="text" class="form-control" placeholder="* * *" required>
                        </div>




                    </form>
                    <button (click)="confirmar()" class=" btn btn-pagar  w-100  fw-bold">
                        Pagar
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
