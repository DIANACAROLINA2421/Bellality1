<section class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <h3 class="mb-4 fw-bold">Happy Shopping <i class=" carrito bi bi-basket2-fill"></i></h3>

            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Carrito</h5>

                    <div class=" d-flex justify-content-between m-b2 ">
                        <div>
                            <p class="fw-semibold m-0">Hydrating Vitamin C Serum</p>
                            <p class="des">30ml .vitamina C+E</p>
                        </div>
                        <div class="d-flex justify-content-center">
                            <input type="number" class="form-control" placeholder="cantidad">

                        </div>
                        <p class="fw-semibold">20.50€/u</p>


                    </div>
                    <button (click)="eliminar()" class=" btn btn-remove "><u> Remove</u></button>
                </div>
            </div>


            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Resumen de tu pedido</h5>

                    <div class="d-flex justify-content-between mb-2">
                        <span>subtotal</span>
                        <span>20.50€</span>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Envío</span>
                        <span class="text">Gratis</span>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span>I.V.A</span>
                        <span>10.20€</span>
                    </div>
                    <hr>

                    <div class="d-flex justify-content-between fw-bold ">

                        <span>Total</span>
                        <span>30.70€</span>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Imformacion De Compra </h5>

                    <form>
                        <div class="mb-3">
                            <label class="form-label">Nombre </label>
                            <input type="text" class="form-control" placeholder="Nombre" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Direccion</label>
                            <input type="text" class="form-control" placeholder="c/****" required>
                        </div>


                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Ciudad</label>
                                <input type="text" class="form-control" placeholder="Madrid" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Disponibilidad Para Entrega:</label><br>
                                <small class="opacity-10">El envio sera de 10-15 dias habiles</small>
                                <input type="datetime-local" class="form-control"  placeholder="fecha-hora" required>

                            </div>

                            <div class="col-md-6 mb-3">
                                <div class="form-check">
                                   <span class="fw-bold">Metodo Pago</span><br>
                                    <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
                                    <label class="form-check-label" for="flexRadioDefault1">
                                        <i class="bi bi-credit-card"></i> Visa
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" checked>
                                    <label class="form-check-label" for="flexRadioDefault2">
                                        <i class="bi bi-paypal"></i> PayPal
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" checked>
                                    <label class="form-check-label" for="flexRadioDefault2">
                                        <i class="bi bi-phone-flip"></i> Bizum
                                    </label>

                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" checked>
                                    <label class="form-check-label" for="flexRadioDefault2">
                                        <i class="bi bi-phone"></i> ApplePay
                                    </label>

                                </div>

                            </div>
                        </div>
                    </form>
                    <button class=" btn btn-compra  w-100  fw-bold" routerLink="/pasarela">
                        Completar compra
                    </button>
                </div>
            </div>

        </div>
    </div>
</section>
