<section class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <h3 class="mb-4 fw-bold">Happy Shopping <i class=" carrito bi bi-basket2-fill"></i></h3>

            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Carrito</h5>

                    <div class=" d-flex justify-content-between m-b2 ">
                        <div>
                            <p class="fw-semibold m-0">Hydrating Vitamin C Serum</p>
                            <p class="des">30ml .vitamina C+E</p>
                        </div>
                        <div class="d-flex justify-content-center">
                            <input type="number" class="form-control" placeholder="cantidad">

                        </div>
                        <p class="fw-semibold">20.50€/u</p>


                    </div>
                    <p class=" btn btn-remove "><u> Delete</u></p>
                </div>
            </div>


            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Resumen de tu pedido</h5>

                    <div class="d-flex justify-content-between mb-2">
                        <span>subtotal</span>
                        <span>20.50€</span>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Envío</span>
                        <span class="text">Gratis</span>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span>I.V.A</span>
                        <span>10.20€</span>
                    </div>
                    <hr>

                    <div class="d-flex justify-content-between fw-bold ">

                        <span>Total</span>
                        <span>30.70€</span>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Pago </h5>

                    <form>
                        <div class="mb-3">
                            <label class="form-label">Nombre del Titular</label>
                            <input type="text" class="form-control" placeholder="Nombre">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Numero de Targeta</label>
                            <input type="text" class="form-control" placeholder="000 000 0000">
                        </div>


                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Fecha Caducidad</label>
                                <input type="text" class="form-control" placeholder="MM/YY">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">CVC</label>
                                <input type="text" class="form-control" placeholder="***">
                            </div>
                        </div>


                        <button class=" btn btn-compra  w-100  fw-bold">
                            Completar compra
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</section>
